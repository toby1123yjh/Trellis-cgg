name: Publish trellis-ccg-lite to npm

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag for this package version
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta

concurrency:
  group: publish-trellis-ccg-lite
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'toby1123yjh/Trellis-cgg'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read and validate Lite package metadata
        id: metadata
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./packages/cli/package.json').name")
          PACKAGE_VERSION=$(node -p "require('./packages/cli/package.json').version")
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          test "$PACKAGE_NAME" = "trellis-ccg-lite"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "core_version=$CORE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify exact Trellis core dependency exists on npm
        shell: bash
        run: |
          CORE_VERSION="${{ steps.metadata.outputs.core_version }}"
          PUBLISHED_CORE=$(npm view "@mindfoldhq/trellis-core@$CORE_VERSION" version --registry=https://registry.npmjs.org/)
          test "$PUBLISHED_CORE" = "$CORE_VERSION"

      - name: Check whether this Lite version is already published
        id: availability
        shell: bash
        run: |
          TARGET="${{ steps.metadata.outputs.name }}@${{ steps.metadata.outputs.version }}"
          if npm view "$TARGET" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$TARGET already exists; publication will be skipped."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build and pack the Lite CLI
        shell: bash
        run: pnpm -C packages/cli pack --pack-destination "$RUNNER_TEMP"

      - name: Verify the exact tarball to publish
        shell: bash
        run: |
          VERSION="${{ steps.metadata.outputs.version }}"
          TARBALL="$RUNNER_TEMP/trellis-ccg-lite-$VERSION.tgz"
          test -f "$TARBALL"
          tar -tzf "$TARBALL" | grep -Fx 'package/package.json'
          tar -tzf "$TARBALL" | grep -Fx 'package/README.md'
          tar -tzf "$TARBALL" | grep -Fx 'package/LICENSE'
          tar -tzf "$TARBALL" | grep -Fx 'package/dist/templates/common/extensions/trellis-ccg-lite/dispatch.py'
          tar -tzf "$TARBALL" | grep -Fx 'package/dist/utils/wrapper-installer.js'
          PACKED_CORE=$(tar -xOzf "$TARBALL" package/package.json | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input).dependencies['@mindfoldhq/trellis-core'] || ''));" )
          test "$PACKED_CORE" = "${{ steps.metadata.outputs.core_version }}"

      - name: Publish the verified Lite tarball
        if: steps.availability.outputs.publish == 'true'
        shell: bash
        run: |
          VERSION="${{ steps.metadata.outputs.version }}"
          npm publish "$RUNNER_TEMP/trellis-ccg-lite-$VERSION.tgz" \
            --access public \
            --tag "${{ inputs.npm_tag }}" \
            --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published Lite package
        if: steps.availability.outputs.publish == 'true'
        shell: bash
        run: |
          TARGET="${{ steps.metadata.outputs.name }}@${{ steps.metadata.outputs.version }}"
          for attempt in {1..12}; do
            if npm view "$TARGET" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              npm view "$TARGET" version dist-tags --json --registry=https://registry.npmjs.org/
              exit 0
            fi
            sleep 5
          done
          echo "$TARGET did not become visible on npm within 60 seconds." >&2
          exit 1
